    body: '至元二十一年（1284年），元大都。忽必烈汗坐在他的宫殿里，看着一张比他祖父成吉思汗打下的疆域还要广阔的地图。陆上的路已经打通了——蒙古铁骑从东海踏到多瑙河。但海上的路呢？大汗需要一个能走海路的人。他选中了一个维吾尔人——亦黑迷失。亦黑迷失出身回鹘（畏兀儿）基督徒家庭，精通多种语言：回鹘语、蒙古语、汉语、波斯语。在元朝的多元帝国里，这样的人才比黄金还珍贵。他不是蒙古贵族，不是汉人儒臣，不是穆斯林商人——他是一个基督徒维吾尔人，站在世界上最强大的皇帝的宫廷里，接下了一道命令：出海，去看看南边还有什么。忽必烈给他的任务三层：出使诸国、收集地理情报、为元朝的海上扩张铺路。亦黑迷失磕头接旨。他要去的地方，蒙古铁骑的马蹄踏不到。',
